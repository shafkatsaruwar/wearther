name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional build number override (leave empty to auto-increment from TestFlight)"
        required: false
        type: string

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & upload to TestFlight
    # App Store Connect requires the iOS 26 SDK (Xcode 26+) for uploads.
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios/Wearther

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: Verify required secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY BUILD_CERTIFICATE_BASE64 P12_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            else
              echo "Found secret: $name"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add the missing secrets, then re-run this workflow."
            exit 1
          fi

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      # Provisioning profiles are created/downloaded by Fastlane `sigh`
      # (manually managed App Store profiles). Do not use apple-actions
      # download here — it often pulls Xcode-managed profiles that fail
      # with Manual signing.

      - name: Setup Ruby / Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios/Wearther

      - name: Install Fastlane
        run: bundle install

      - name: Resolve Swift packages / project sanity
        run: xcodebuild -list -project Wearther.xcodeproj

      - name: Build & upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
        run: bundle exec fastlane beta
